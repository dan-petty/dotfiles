# =============================================================================
# Starship Prompt Configuration (starship.toml)
# =============================================================================

add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$kubernetes\
$python\
$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold blue"
format = '[$symbol$context( \($namespace\))]($style) '

[python]
symbol = " "
style = "yellow"

[cmd_duration]
min_time = 2_000
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
